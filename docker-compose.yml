services:
    postgres:
        container_name: aucy_postgres
        image: postgres:17
        environment: 
            POSTGRES_DB: "${POSTGRES_DB:-aucy_dev_db}"
            POSTGRES_USER: "${POSTGRES_USER:-postgres}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-YourStrong!Passw0rd1}"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-6768}:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 30s
            timeout: 5s
            retries: 5

    redis:
        container_name: aucy_redis
        image: redis:7.4-alpine
        volumes:
            - redis_data:/data
        ports:
            - "${REDIS_PORT:-6379}:6379"
        environment:
            - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-YourStrong!Passw0rd} --appendonly yes
        restart: unless-stopped
        
volumes:
    postgres_data:
    redis_data:
        driver: local
services:
    mssql:
        container_name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}"
            MSSQL_PID: "Developer"
            MSSQL_DB: "${MSSQL_DB:-aucy_dev_db}"
        volumes:
            - mssql-data:/var/opt/mssql
        ports:
            - "${MSSQL_PORT:-6768}:1433"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd} -C -Q 'SELECT 1' || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    mssql-data: